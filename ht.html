<style
  data-savepage-href="https://blue.baccredomatic.com/v3/css/blue-main-style.css"
>
  .btn,
  .input-text,
  .list__ordered-li::marker,
  [class*="typography-"] {
    font-family: Graphik, Helvetica, sans-serif;
  }
  .btn,
  .dfa-input,
  .see-more-parent,
  .see-more-principal,
  .selection-box-label,
  .table-data-parent,
  .wizard-step-text {
    text-align: center;
  }
  .footer-main,
  .grid-container *,
  .grid-container-fluid,
  .grid-container-fluid *,
  .header-medium,
  .header-notification-counter {
    box-sizing: border-box;
  }
  :root {
    --c-brand-low: 228, 0, 43;
    --c-brand-medium: 200, 16, 47;
    --c-brand-high: 166, 25, 46;
    --c-brand-extrahigh: 118, 35, 47;
    --c-white: 255, 255, 255;
    --c-background: 241, 241, 242;
    --c-neutral-low: 230, 230, 230;
    --c-neutral-medium: 190, 190, 190;
    --c-neutral: 158, 158, 158;
    --c-neutral-high: 109, 110, 113;
    --c-neutral-extrahigh: 77, 77, 79;
    --c-black-low: 43, 43, 43;
    --c-black: 0, 0, 0;
    --c-gray-soft-high: 162, 179, 190;
    --c-gray-soft: 189, 202, 211;
    --c-importance-low: 179, 62, 150;
    --c-importance-medium: 145, 40, 127;
    --c-importance-high: 112, 26, 83;
    --c-importance-low-soft-high: 154, 107, 146;
    --c-importance-low-soft: 200, 147, 191;
    --c-importance-soft: 226, 164, 216;
    --c-importance-soft-high: 193, 133, 184;
    --c-purple-soft-high: 159, 154, 216;
    --c-purple-soft: 178, 172, 248;
    --c-positive-extralow: 100, 207, 138;
    --c-positive-low: 110, 191, 93;
    --c-positive-medium: 42, 148, 70;
    --c-positive-high: 0, 113, 71;
    --c-interaction-extralow: 74, 144, 226;
    --c-interaction-low: 16, 117, 187;
    --c-interaction-low-medium: 10, 96, 156;
    --c-interaction-medium: 0, 53, 148;
    --c-interaction-high: 0, 26, 112;
    --c-interaction-disabled: 147, 193, 224;
    --c-interaction-soft: 132, 196, 241;
    --c-interaction-soft-high: 97, 165, 212;
    --c-yellow-background: 254, 245, 221;
    --c-blue-background: 225, 250, 253;
    --c-pink-background: 255, 228, 247;
    --c-attention-low: 245, 136, 31;
    --c-attention-medium: 205, 85, 39;
    --c-attention-high: 173, 31, 44;
    --c-attention-soft: 248, 172, 172;
    --c-attention-soft-high: 229, 137, 137;
    --c-informative-medium: 27, 162, 180;
    --c-kash-soft-high: 117, 177, 184;
    --c-kash-soft: 140, 200, 207;
    --c-highlight-medium: 245, 185, 31;
    --c-highlight-soft: 227, 196, 117;
    --c-highlight-soft-high: 205, 177, 104;
    --c-error-low: 228, 0, 43;
    --c-critical-low: 200, 16, 47;
    --c-critical-medium: 166, 25, 46;
    --c-critical-high: 118, 35, 47;
    --c-critical-medium-soft-high: 181, 102, 116;
    --c-critical-medium-soft: 217, 133, 148;
    --c-red-soft-high: 181, 102, 116;
    --c-red-soft: 217, 133, 148;
  }
  .tab-focus + .checkbox-button-icon .checkbox-icon,
  .tab-focus + .radio-button-icon .radio-icon,
  .tab-focus + .switch-slider {
    box-shadow: 0 0 0 3px rgba(16, 117, 187, 0.3) !important;
    outline: 0 !important;
  }
  @keyframes shake {
    0%,
    100% {
      transform: translate(0, 0);
    }
    20%,
    60% {
      transform: translate(5%, 0);
    }
    40%,
    80% {
      transform: translate(-5%, 0);
    }
  }
  @-webkit-keyframes shake {
    0%,
    100% {
      transform: translate(0, 0);
    }
    20%,
    60% {
      transform: translate(5%, 0);
    }
    40%,
    80% {
      transform: translate(-5%, 0);
    }
  }
  @keyframes swing {
    0% {
      transform: translate(0) rotate(0);
    }
    20% {
      transform: translate(0) rotate(20deg);
    }
    100%,
    40%,
    80% {
      transform: translate(0) rotate(-10deg);
    }
    60% {
      transform: translate(0) rotate(10deg);
    }
  }
  @keyframes tada {
    0% {
      transform: translate(0) rotate(0) scaleX(1) scaleY(1);
    }
    10%,
    20% {
      transform: translate(0) rotate(-3deg) scaleX(0.8) scaleY(0.8);
    }
    30%,
    50%,
    70%,
    90% {
      transform: translate(0) rotate(3deg) scaleX(1.2) scaleY(1.2);
    }
    40%,
    60%,
    80% {
      transform: translate(0) rotate(-3deg) scaleX(1.2) scaleY(1.2);
    }
    100% {
      transform: translate(0) rotate(0) scaleX(1.2) scaleY(1.2);
    }
  }
  @keyframes rotate-in {
    100% {
      opacity: 1;
      transform: rotate(360deg);
    }
  }
  @-webkit-keyframes rotate-in {
    0% {
      opacity: 0;
      -webkit-transform: translate(0) rotate(-270deg);
    }
    100% {
      opacity: 1;
      -webkit-transform: translate(0) rotate(0);
    }
  }
  @keyframes fade-in {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
  @-webkit-keyframes fade-in {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
  @keyframes ripple {
    to {
      transform: scaleX(4);
      opacity: 0;
    }
  }
  @keyframes modalFadeInOpacity {
    from {
      opacity: 0;
    }
    to {
      opacity: 0.9;
    }
  }
  @keyframes modalFadeIn {
    0% {
      max-height: 0;
    }
    100% {
      max-height: 87%;
    }
  }
  @keyframes modalFadeOutOpacity {
    from {
      opacity: 0.9;
    }
    to {
      opacity: 0;
    }
  }
  @keyframes loading-spinner {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0.2;
    }
  }
  @keyframes modalFadeOut {
    0% {
      max-height: 87%;
    }
    100% {
      max-height: 0;
    }
  }
  @keyframes dash {
    0% {
      stroke-dashoffset: 400px;
    }
  }
  @keyframes move-right {
    0% {
      transform: translate(-30px, var(--animationInitY))
        rotate(var(--iniRotate));
    }
    100% {
      transform: translate(var(--animationEndX), var(--animationEndY))
        rotate(var(--endRotate));
    }
  }
  @keyframes fadeIncreaseOpacity {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 0.9;
    }
  }
  @keyframes fadeDecreaseOpacity {
    0% {
      opacity: 0.9;
    }
    100% {
      opacity: 0;
    }
  }
  @keyframes fadeFlexToNone {
    0% {
      display: flex;
    }
    100% {
      display: none;
    }
  }
  @keyframes fadeToDown {
    0% {
      transform: translateY(-100%);
    }
    100% {
      transform: translateY(0);
    }
  }
  @keyframes fadeToUp {
    0% {
      transform: translateY(100%);
    }
    100% {
      transform: translateY(0);
    }
  }
  @keyframes fadeToRight {
    0% {
      transform: translateX(100%);
    }
    100% {
      transform: translateX(0);
    }
  }
  @keyframes fadeToLeft {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(0);
    }
  }
  @keyframes slideUp {
    0%,
    100% {
      opacity: 0.05;
    }
    50% {
      opacity: 0.35;
    }
  }
  @keyframes pulse {
    from {
      transform: scale(1);
    }
    to {
      transform: scale(2.25);
      stroke: transparent;
      fill: transparent;
    }
  }
  @keyframes fill_success {
    from {
      fill: rgba(var(--init-fill), 1);
      box-shadow: inset 0 0 0 #fff;
    }
    to {
      fill: rgba(var(--main-color), 1);
      box-shadow: inset 0 0 0 30px #000;
    }
  }
  @keyframes pulse_neutral-medium {
    0% {
      box-shadow: 0 0 0 0 #bebebe;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_neutral-extrahigh {
    0% {
      box-shadow: 0 0 0 0 #4d4d4f;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_informative-medium {
    0% {
      box-shadow: 0 0 0 0 #1ba2b4;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_interaction-low {
    0% {
      box-shadow: 0 0 0 0 #1075bb;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @-webkit-keyframes pulse_interaction-low {
    0% {
      -webkit-box-shadow: 0 0 0 0 #1075bb;
      box-shadow: 0 0 0 0 #1075bb;
    }
    100% {
      -webkit-box-shadow: 0 0 0 5px transparent;
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_positive-medium {
    0% {
      box-shadow: 0 0 0 0 #2a9446;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_attention-low {
    0% {
      box-shadow: 0 0 0 0 #f5881f;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_critical-low {
    0% {
      box-shadow: 0 0 0 0 #c8102f;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes pulse_importance-low {
    0% {
      box-shadow: 0 0 0 0 #b33e96;
    }
    100% {
      box-shadow: 0 0 0 5px transparent;
    }
  }
  @keyframes rotate-360-left {
    0% {
      transform: rotate(0);
    }
    100% {
      transform: rotate(-360deg);
    }
  }
  @keyframes rotate-360-right {
    0% {
      transform: rotate(0);
    }
    100% {
      transform: rotate(360deg);
    }
  }
  @keyframes expand-btn-float {
    from {
      width: 50px;
      border-radius: 25px;
    }
    to {
      width: 100%;
      border-radius: 25px;
    }
  }
  @keyframes shrink-btn-float {
    from {
      width: 100%;
      border-radius: 25px;
    }
    to {
      width: 50px;
      border-radius: 25px;
    }
  }
  @keyframes fade-in-opacity {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }
  @keyframes fade-out-opacity {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }
  @keyframes fade-in-top {
    0% {
      transform: translateY(-25px);
      opacity: 0;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  @keyframes fade-out-top {
    0% {
      transform: translateY(0);
      opacity: 1;
    }
    100% {
      transform: translateY(-25px);
      opacity: 0;
    }
  }
  @keyframes fade-in-right {
    0% {
      transform: translateX(25px);
      opacity: 0;
    }
    100% {
      transform: translateX(0);
      opacity: 1;
    }
  }
  @keyframes fade-out-right {
    0% {
      transform: translateX(0);
      opacity: 1;
    }
    100% {
      transform: translateX(25px);
      opacity: 0;
    }
  }
  @keyframes fade-in-bottom {
    0% {
      transform: translateY(25px);
      opacity: 0;
    }
    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }
  @keyframes fade-out-bottom {
    0% {
      transform: translateY(0);
      opacity: 1;
    }
    100% {
      transform: translateY(25px);
      opacity: 0;
    }
  }
  @keyframes fade-in-left {
    0% {
      transform: translateX(-25px);
      opacity: 0;
    }
    100% {
      transform: translateX(0);
      opacity: 1;
    }
  }
  @keyframes fade-out-left {
    0% {
      transform: translateX(0);
      opacity: 1;
    }
    100% {
      transform: translateX(-25px);
      opacity: 0;
    }
  }
  @keyframes topFromZeroTo100 {
    from {
      top: 0;
    }
    to {
      top: 100%;
    }
  }
  @keyframes topFrom100ToZero {
    from {
      top: 100%;
    }
    to {
      top: 0;
    }
  }
  @keyframes waiting-loading-stroke {
    100% {
      stroke-dashoffset: 0;
    }
  }
  @keyframes waiting-loading-radial {
    100% {
      stroke-dashoffset: 720;
    }
  }
